services:
  startalk-sessions:
    image: ${DOCKER_USERNAME:?err}/startalk-sessions:latest
    container_name: startalk-sessions
    restart: unless-stopped
    ports:
      - "${PORT:-6200}:6200"
    environment:
      # The app binds Kestrel to 0.0.0.0:{PORT} (see Program.cs). Defaults to 6200.
      - PORT=${PORT:-6200}
      - DB_CONNECT=${DB_CONNECT:?err}

      # --- Store branding ---
      - STORE_NAME=${STORE_NAME:-Star Talk Sessions}
      - STORE_TAGLINE=${STORE_TAGLINE:-Stories that move people forward.}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-info@startalksessions.org}
      - SUPPORT_PHONE=${SUPPORT_PHONE:-+234 800 000 0000}
      - SITE_URL=${SITE_URL:-https://startalksessions.org}
      - STUDIO_ADDRESS_1=${STUDIO_ADDRESS_1:-Star Talk Studios, Minna}
      - STUDIO_ADDRESS_2=${STUDIO_ADDRESS_2:-Federal University of Technology, Minna}

      # --- Admin account ---
      - ADMIN_EMAIL=${ADMIN_EMAIL:?err}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?err}
      - ADMIN_NAME=${ADMIN_NAME:-Star Talk Sessions}

      # --- Email (Resend) - optional ---
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_APITOKEN=${RESEND_APITOKEN:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-info@startalksessions.org}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME:-Star Talk Sessions}

      # --- WhatsApp - optional ---
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER:-}
      - WHATSAPP_COUNTRY_CODE=${WHATSAPP_COUNTRY_CODE:-234}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - WHATSAPP_NUMBER_ID=${WHATSAPP_NUMBER_ID:-}

      # --- Google AdSense - optional ---
      - ADSENSE_CLIENT_ID=${ADSENSE_CLIENT_ID:-ca-pub-2447961066740044}
      - NEXT_PUBLIC_ADSENSE_CLIENT_ID=${NEXT_PUBLIC_ADSENSE_CLIENT_ID:-ca-pub-2447961066740044}
      - ADSENSE_SLOT_HEADER=${ADSENSE_SLOT_HEADER:-}
      - ADSENSE_SLOT_SIDEBAR=${ADSENSE_SLOT_SIDEBAR:-}
      - ADSENSE_SLOT_INLINE=${ADSENSE_SLOT_INLINE:-}
      - ADSENSE_SLOT_FOOTER=${ADSENSE_SLOT_FOOTER:-}
      - ADSENSE_SLOT_DETAIL=${ADSENSE_SLOT_DETAIL:-}

      # --- AI Support Assistant - optional ---
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
